<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg-hfb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b16"/>
      <stop offset="100%" stop-color="#150c24"/>
    </linearGradient>
    <linearGradient id="stroke-hfb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glowV-hfb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC-hfb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-hfb" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.07)"/>
    </pattern>
  </defs>

  <rect width="400" height="250" fill="url(#bg-hfb)"/>
  <rect width="400" height="250" fill="url(#grid-hfb)"/>
  <circle cx="200" cy="40" r="120" fill="url(#glowV-hfb)"/>
  <circle cx="60" cy="220" r="130" fill="url(#glowC-hfb)"/>
  <circle cx="340" cy="220" r="130" fill="url(#glowC-hfb)"/>

  <!-- lignes de l'arborescence AD/GPO -->
  <g stroke="url(#stroke-hfb)" stroke-width="2" fill="none">
    <line x1="200" y1="80" x2="200" y2="104"/>
    <line x1="200" y1="104" x2="90" y2="104"/>
    <line x1="200" y1="104" x2="200" y2="104"/>
    <line x1="200" y1="104" x2="310" y2="104"/>
    <line x1="90" y1="104" x2="90" y2="130"/>
    <line x1="200" y1="104" x2="200" y2="130"/>
    <line x1="310" y1="104" x2="310" y2="130"/>
    <line x1="90" y1="150" x2="55" y2="180"/>
    <line x1="90" y1="150" x2="125" y2="180"/>
    <line x1="310" y1="150" x2="275" y2="180"/>
    <line x1="310" y1="150" x2="345" y2="180"/>
  </g>

  <!-- noeud racine : bouclier -->
  <path d="M200 34 L222 44 V64 C222 78 212 88 200 94 C188 88 178 78 178 64 V44 Z"
    fill="rgba(139,92,246,0.1)" stroke="url(#stroke-hfb)" stroke-width="2.5"/>
  <path d="M191 62 L198 70 L211 52" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- noeuds intermédiaires (OU) -->
  <g stroke="url(#stroke-hfb)" stroke-width="2" fill="rgba(255,255,255,0.03)">
    <rect x="76" y="104" width="28" height="22" rx="4"/>
    <rect x="186" y="104" width="28" height="22" rx="4"/>
    <rect x="296" y="104" width="28" height="22" rx="4"/>
  </g>

  <!-- feuilles (postes utilisateurs) -->
  <g stroke="url(#stroke-hfb)" stroke-width="2" fill="rgba(34,211,238,0.06)">
    <circle cx="55" cy="192" r="12"/>
    <circle cx="125" cy="192" r="12"/>
    <circle cx="200" cy="150" r="12"/>
    <circle cx="275" cy="192" r="12"/>
    <circle cx="345" cy="192" r="12"/>
  </g>
  <g fill="#e5e7eb" opacity="0.8">
    <circle cx="55" cy="188" r="3.4"/>
    <path d="M48 198 q7 -8 14 0" fill="none" stroke="#e5e7eb" stroke-width="2" stroke-linecap="round"/>
    <circle cx="125" cy="188" r="3.4"/>
    <path d="M118 198 q7 -8 14 0" fill="none" stroke="#e5e7eb" stroke-width="2" stroke-linecap="round"/>
    <circle cx="200" cy="146" r="3.4"/>
    <path d="M193 156 q7 -8 14 0" fill="none" stroke="#e5e7eb" stroke-width="2" stroke-linecap="round"/>
    <circle cx="275" cy="188" r="3.4"/>
    <path d="M268 198 q7 -8 14 0" fill="none" stroke="#e5e7eb" stroke-width="2" stroke-linecap="round"/>
    <circle cx="345" cy="188" r="3.4"/>
    <path d="M338 198 q7 -8 14 0" fill="none" stroke="#e5e7eb" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
