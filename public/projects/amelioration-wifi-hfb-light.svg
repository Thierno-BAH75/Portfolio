<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg-wifi-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="stroke-wifi-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glowV-wifi-light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC-wifi-light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-wifi-light" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(15,23,42,0.06)"/>
    </pattern>
  </defs>

  <rect width="400" height="250" fill="url(#bg-wifi-light)"/>
  <rect width="400" height="250" fill="url(#grid-wifi-light)"/>
  <circle cx="200" cy="230" r="150" fill="url(#glowC-wifi-light)"/>
  <circle cx="200" cy="60" r="120" fill="url(#glowV-wifi-light)"/>

  <!-- arcs wifi concentriques -->
  <g stroke="url(#stroke-wifi-light)" fill="none" stroke-linecap="round">
    <path d="M140 190 A90 90 0 0 1 260 190" stroke-width="3" opacity="0.9"/>
    <path d="M162 190 A66 66 0 0 1 238 190" stroke-width="3" opacity="0.7"/>
    <path d="M184 190 A42 42 0 0 1 216 190" stroke-width="3" opacity="0.55"/>
  </g>

  <!-- borne d'accès (AP) -->
  <g>
    <rect x="178" y="188" width="44" height="20" rx="5" fill="rgba(255,255,255,0.6)" stroke="url(#stroke-wifi-light)" stroke-width="2.5"/>
    <circle cx="200" cy="198" r="3" fill="#0891b2"/>
  </g>

  <!-- appareils connectés -->
  <g stroke="rgba(15,23,42,0.32)" stroke-width="1.5" stroke-dasharray="3 4">
    <line x1="200" y1="188" x2="90" y2="120"/>
    <line x1="200" y1="188" x2="310" y2="120"/>
    <line x1="200" y1="188" x2="80" y2="70"/>
    <line x1="200" y1="188" x2="320" y2="70"/>
  </g>
  <g stroke="url(#stroke-wifi-light)" stroke-width="2" fill="rgba(124,58,237,0.08)">
    <circle cx="90" cy="120" r="11"/>
    <circle cx="310" cy="120" r="11"/>
    <circle cx="80" cy="70" r="9"/>
    <circle cx="320" cy="70" r="9"/>
  </g>
  <g fill="#3f3f46" opacity="0.85">
    <rect x="85" y="115" width="10" height="8" rx="1.5"/>
    <rect x="305" y="115" width="10" height="8" rx="1.5"/>
    <circle cx="80" cy="70" r="2.6"/>
    <circle cx="320" cy="70" r="2.6"/>
  </g>
</svg>
