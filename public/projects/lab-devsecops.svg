<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg-lab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b16"/>
      <stop offset="100%" stop-color="#0c1a26"/>
    </linearGradient>
    <linearGradient id="stroke-lab" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glowV-lab" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC-lab" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-lab" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.07)"/>
    </pattern>
  </defs>

  <rect width="400" height="250" fill="url(#bg-lab)"/>
  <rect width="400" height="250" fill="url(#grid-lab)"/>
  <circle cx="90" cy="200" r="130" fill="url(#glowV-lab)"/>
  <circle cx="320" cy="60" r="140" fill="url(#glowC-lab)"/>

  <!-- forme nuage en arrière-plan -->
  <path d="M110 96 a26 26 0 0 1 50 -10 a20 20 0 0 1 34 14 a22 22 0 0 1 -4 44 H96 a20 20 0 0 1 -6 -39 Z"
    fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="2"/>

  <!-- pipeline de conteneurs -->
  <g stroke="url(#stroke-lab)" stroke-width="2.5" fill="rgba(255,255,255,0.02)">
    <rect x="56" y="150" width="52" height="52" rx="8"/>
    <rect x="140" y="150" width="52" height="52" rx="8"/>
    <rect x="224" y="150" width="52" height="52" rx="8"/>
    <rect x="308" y="150" width="52" height="52" rx="8"/>
  </g>

  <!-- icônes conteneur (caisses) -->
  <g stroke="rgba(255,255,255,0.35)" stroke-width="1.6" fill="none">
    <path d="M66 168 L82 160 L98 168 L82 176 Z"/>
    <line x1="82" y1="176" x2="82" y2="190"/>
    <path d="M150 168 L166 160 L182 168 L166 176 Z"/>
    <line x1="166" y1="176" x2="166" y2="190"/>
    <path d="M234 168 L250 160 L266 168 L250 176 Z"/>
    <line x1="250" y1="176" x2="250" y2="190"/>
    <path d="M318 168 L334 160 L350 168 L334 176 Z"/>
    <line x1="334" y1="176" x2="334" y2="190"/>
  </g>

  <!-- flèches de pipeline -->
  <g stroke="#22d3ee" stroke-width="2.5" fill="none" stroke-linecap="round">
    <line x1="108" y1="176" x2="136" y2="176"/>
    <polygon points="136,176 128,171 128,181" fill="#22d3ee" stroke="none"/>
    <line x1="192" y1="176" x2="220" y2="176"/>
    <polygon points="220,176 212,171 212,181" fill="#22d3ee" stroke="none"/>
    <line x1="276" y1="176" x2="304" y2="176"/>
    <polygon points="304,176 296,171 296,181" fill="#8b5cf6" stroke="none"/>
  </g>

  <!-- coche sécurité sur le dernier conteneur -->
  <circle cx="334" cy="176" r="15" fill="rgba(139,92,246,0.12)" stroke="#8b5cf6" stroke-width="2"/>
  <path d="M327 176 L332 182 L342 168" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
</svg>
